name: mermaid-converter

services:
  frontend:
    build:
      context: ./Mermaid_General_Pic-Web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - mermaid-network
    restart: unless-stopped

  backend:
    build:
      context: ./Mermaid_General_Pic-Services
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=debug
    volumes:
      - ./Mermaid_General_Pic-Services/logs:/app/logs
      - ./Mermaid_General_Pic-Services/static:/app/static
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/mermaid/formats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mermaid-network
    restart: unless-stopped

networks:
  mermaid-network:
    driver: bridge

volumes:
  logs:
  static: 